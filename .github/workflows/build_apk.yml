name: NEON PRO - Auto Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Installable Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android & Buildozer System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip patch ant lbzip2 xz-utils \
            openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake ccache lld \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Cache Buildozer & Gradle Directories
        uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle/caches
          key: ubuntu22-v3-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ubuntu22-v3-buildozer-

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "setuptools<66.0.0" wheel virtualenv cython==0.29.36 buildozer

      - name: Build & Sign Android APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Verify APK Output
        run: |
          ls -lh bin/*.apk
          unzip -t bin/*.apk | tail -n 5

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonMobile-Android-APK
          path: bin/*.apk
          if-no-files-found: error
