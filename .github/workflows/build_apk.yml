name: NEON PRO - Build Android APK & Windows EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: neon-pro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed Installable Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android & Buildozer System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip patch ant lbzip2 xz-utils \
            openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake ccache lld \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Cache Buildozer & Gradle Directories
        uses: actions/cache@v6
        with:
          path: |
            .buildozer
            ~/.buildozer
            ~/.gradle/caches
          key: ubuntu22-v4-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ubuntu22-v4-buildozer-

      - name: Install Buildozer & Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "setuptools<66.0.0" wheel virtualenv cython==0.29.36 buildozer

      - name: Build & Sign Android APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Verify APK Output
        run: |
          ls -lh bin/*.apk
          unzip -t bin/*.apk | tail -n 5

      - name: Upload Installable Android APK
        uses: actions/upload-artifact@v7
        with:
          name: NeonMobile-Android-APK
          path: bin/*.apk
          if-no-files-found: error

  build_exe:
    name: Build Windows Standalone EXE
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PIP_NO_INPUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      KIVY_NO_ARGS: '1'
      KIVY_NO_CONSOLELOG: '1'
      KIVY_NO_FILELOG: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Speed Up Windows Build (Defender Exclusion)
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE, $env:LOCALAPPDATA, $env:TEMP -ErrorAction SilentlyContinue
          } catch {}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Windows Packaging Dependencies
        run: |
          python -m pip install --prefer-binary --no-input "kivy==2.3.2" requests certifi urllib3 pyinstaller
          python -c "import kivy, pyinstaller; print('Kivy:', kivy.__version__, 'PyInstaller:', pyinstaller.__version__)"

      - name: Compile Standalone Windows EXE
        run: |
          pyinstaller --noconfirm --noconsole --onefile --noupx --log-level=INFO --exclude-module tkinter --exclude-module unittest --exclude-module test --exclude-module pydoc --name "NeonMobile_Windows" main.py

      - name: Verify Windows EXE Output
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: NeonMobile-Windows-EXE
          path: dist/*.exe
          if-no-files-found: error
